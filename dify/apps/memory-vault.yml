app:
  description: 记忆银行：跨会话记忆养成助手。记住玩家的称呼、推理风格与已排除线索，新会话依然认得。
  icon: 🗂️
  icon_background: '#EFF1F5'
  mode: advanced-chat
  name: 记忆银行
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext 服务地址，例如 http://host.docker.internal:8000
    id: 8f1c2d30-1a01-4b7e-9c11-0a1b2c3d4e01
    name: POWERCONTEXT_URL
    selector:
    - env
    - POWERCONTEXT_URL
    value: http://host.docker.internal:8000
    value_type: string
  - description: 本应用使用的 scope id，由 dify/scripts/init_scope.sh 产出
    id: 8f1c2d30-1a02-4b7e-9c11-0a1b2c3d4e01
    name: POWERCONTEXT_SCOPE_ID
    selector:
    - env
    - POWERCONTEXT_SCOPE_ID
    value: replace-with-scope-id
    value_type: string
  - description: 启用鉴权时填写，本机 loopback 安装留空
    id: 8f1c2d30-1a03-4b7e-9c11-0a1b2c3d4e01
    name: POWERCONTEXT_TOKEN
    selector:
    - env
    - POWERCONTEXT_TOKEN
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: 我是档案员。说说你的案件编号和想法，我会记得你说过的每一句。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: 1739504388251-source-1739504388261-target
      source: '1739504388251'
      sourceHandle: source
      target: '1739504388261'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: 1739504388261-source-1739504388271-target
      source: '1739504388261'
      sourceHandle: source
      target: '1739504388271'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: 1739504388271-source-1739504388281-target
      source: '1739504388271'
      sourceHandle: source
      target: '1739504388281'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: 1739504388281-source-1739504388291-target
      source: '1739504388281'
      sourceHandle: source
      target: '1739504388291'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: 1739504388291-source-1739504388301-target
      source: '1739504388291'
      sourceHandle: source
      target: '1739504388301'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: 1739504388301-source-1739504388311-target
      source: '1739504388301'
      sourceHandle: source
      target: '1739504388311'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 玩家输入案件编号、称呼与本轮推理
        selected: false
        title: 开始
        type: start
        variables:
        - label: 案件编号
          max_length: 64
          options: []
          required: true
          type: text-input
          variable: case_id
        - label: 你希望我怎么称呼你
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: player_name
        - label: 推理输入
          max_length: 4096
          options: []
          required: true
          type: paragraph
          variable: player_input
      height: 168
      id: '1739504388251'
      position:
        x: 60
        y: 282
      positionAbsolute:
        x: 60
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: field-scope-id
            key: scope_id
            type: text
            value: '{{#env.POWERCONTEXT_SCOPE_ID#}}'
          - id: field-query
            key: query
            type: text
            value: '{{#1739504388251.case_id#}} {{#1739504388251.player_name#}} 推理 线索 称呼 偏好 已排除'
          type: json
        desc: 从 PowerContext 召回该玩家在本案的既往记忆
        headers: ''
        method: post
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 2
          retry_interval: 1000
        selected: false
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 召回记忆
        type: http-request
        url: '{{#env.POWERCONTEXT_URL#}}/v1/memory/search'
        variables: []
      height: 96
      id: '1739504388261'
      position:
        x: 360
        y: 282
      positionAbsolute:
        x: 360
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str) -> dict:\n    \"\"\"把 PowerContext 的检索结果整理成一段可直接注入提示词的文字。\"\"\"\n    try:\n        payload = json.loads(body) if body else {}\n    except Exception:\n        payload = {}\n    if not isinstance(payload, dict):\n        payload = {}\n    hits = payload.get(\"hits\") or []\n    lines = []\n    for hit in hits[:8]:\n        if not isinstance(hit, dict):\n            continue\n        text = (hit.get(\"text\") or \"\").strip()\n        if not text:\n            continue\n        try:\n            score = float(hit.get(\"score\") or 0.0)\n        except Exception:\n            score = 0.0\n        lines.append(\"- [%s] %s\" % (round(score, 3), text[:400]))\n    if lines:\n        memory_block = \"\\n\".join(lines)\n    else:\n        memory_block = \"（记忆库中没有与本案相关的记录，这可能是你们第一次合作。）\"\n    return {\"memory_block\": memory_block, \"hit_count\": len(lines)}\n"
        code_language: python3
        desc: 解析检索结果，生成记忆块
        outputs:
          hit_count:
            children: null
            type: number
          memory_block:
            children: null
            type: string
        selected: false
        title: 解析记忆
        type: code
        variables:
        - value_selector:
          - '1739504388261'
          - body
          variable: body
      height: 54
      id: '1739504388271'
      position:
        x: 660
        y: 282
      positionAbsolute:
        x: 660
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 侦探 NPC，结合召回的记忆作答
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 9a7c1e00-0001-4b7e-9c11-0a1b2c3d4e01
          role: system
          text: "你是一位侦探 NPC，代号「档案员」。你在和一位调查者合作破案。\n\n## 关于这位调查者（来自 PowerContext 记忆库）\n{{#1739504388271.memory_block#}}\n\n## 本局信息\n- 案件编号：{{#1739504388251.case_id#}}\n- 玩家的称呼：{{#1739504388251.player_name#}}\n\n## 你的行为准则\n1. **优先使用记忆库里的信息**。如果记忆里记录了玩家的称呼、推理风格或已排除的线索，\n   你要自然地体现出来（用他喜欢的称呼、避开他已经排除过的方向）。\n2. 若记忆为空，按新客户处理，不要假装你们认识。\n3. 不要编造案件事实，只基于玩家提供的信息推进。\n4. 回复用中文，控制在 150 字以内。给出你的观察，并抛出一个能把对话推进下去的问题。\n5. 不要罗列你「记住了」什么，用对话体现记忆。\n"
        selected: false
        title: 侦探 NPC
        type: llm
        variables: []
        vision:
          enabled: false
      height: 96
      id: '1739504388281'
      position:
        x: 960
        y: 282
      positionAbsolute:
        x: 960
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(npc_text: str, player_input: str, case_id: str) -> dict:\n    \"\"\"从本轮对话里提炼一条值得记住的记录。\"\"\"\n    player_input = (player_input or \"\").strip()\n    npc_text = (npc_text or \"\").strip()\n    case_id = (case_id or \"未命名\").strip()\n    if player_input:\n        note = \"案件 %s：玩家提到「%s」。\" % (case_id, player_input[:300])\n    else:\n        note = \"案件 %s：玩家本轮没有留下可记录的信息。\" % case_id\n    if npc_text:\n        note = note + \" 侦探回应：%s\" % npc_text[:300]\n    return {\"note\": note}\n"
        code_language: python3
        desc: 提炼本轮记忆条目
        outputs:
          note:
            children: null
            type: string
        selected: false
        title: 提炼记忆
        type: code
        variables:
        - value_selector:
          - '1739504388281'
          - text
          variable: npc_text
        - value_selector:
          - '1739504388251'
          - player_input
          variable: player_input
        - value_selector:
          - '1739504388251'
          - case_id
          variable: case_id
      height: 54
      id: '1739504388291'
      position:
        x: 1260
        y: 282
      positionAbsolute:
        x: 1260
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: field-scope-id
            key: scope_id
            type: text
            value: '{{#env.POWERCONTEXT_SCOPE_ID#}}'
          - id: field-kind
            key: kind
            type: text
            value: session
          - id: field-text
            key: text
            type: text
            value: '{{#1739504388291.note#}}'
          type: json
        desc: 把本轮记忆写入 PowerContext
        headers: ''
        method: post
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 2
          retry_interval: 1000
        selected: false
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 写入记忆
        type: http-request
        url: '{{#env.POWERCONTEXT_URL#}}/v1/memory/remember'
        variables: []
      height: 96
      id: '1739504388301'
      position:
        x: 1560
        y: 282
      positionAbsolute:
        x: 1560
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#1739504388281.text#}}'
        desc: 展示给玩家
        selected: false
        title: 回答
        type: answer
        variables: []
      height: 104
      id: '1739504388311'
      position:
        x: 1860
        y: 282
      positionAbsolute:
        x: 1860
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
